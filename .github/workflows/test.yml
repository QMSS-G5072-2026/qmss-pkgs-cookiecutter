name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run monthly so we notice when upstream tools change
    - cron: "0 0 1 * *"

jobs:
  test-template:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Test that the template renders for every option
        run: uv run --no-project --python 3.13 --with cookiecutter --with pytest pytest tests/

      - name: Generated package installs, tests, documents, and builds
        shell: bash
        run: |
          uvx cookiecutter . --no-input --output-dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/mypkg"
          uv sync
          uv run pytest
          uv run sphinx-build -b html docs docs/_build/html
          uv build
